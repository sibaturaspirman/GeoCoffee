<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3346A8">
<title>GeoCoffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#3346A8; --cobalt-deep:#26358A; --chalk:#FFFFFF; --night:#000000;
  --paper:#ECEBE6; --card:#F6F5F1; --ink:#3346A8; --ink-2:rgba(51,70,168,.72); --ink-3:rgba(51,70,168,.5); --line:rgba(51,70,168,.28);
  --warn:#9A4F14; --warn-bg:#F4E5D4; --danger:#B3302A; --danger-bg:#F4DCD8; --ok:#276B48; --ok-bg:#D8E9DE;
  --outer:#D6D5CF; --top:#3346A8;
  --hand:"Gochi Hand","Comic Sans MS","Chalkboard SE",cursive;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12141C; --card:#1A1D29; --ink:#BCC5FF; --ink-2:rgba(188,197,255,.74); --ink-3:rgba(188,197,255,.5); --line:rgba(188,197,255,.22);
    --warn:#F2A766; --warn-bg:#3A2A1B; --danger:#FF8C80; --danger-bg:#3D1F1C; --ok:#86D6A8; --ok-bg:#15301F; --outer:#07080C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12141C; --card:#1A1D29; --ink:#BCC5FF; --ink-2:rgba(188,197,255,.74); --ink-3:rgba(188,197,255,.5); --line:rgba(188,197,255,.22);
  --warn:#F2A766; --warn-bg:#3A2A1B; --danger:#FF8C80; --danger-bg:#3D1F1C; --ok:#86D6A8; --ok-bg:#15301F; --outer:#07080C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--top);scroll-padding-top:env(safe-area-inset-top,0px)}
@media (min-width:520px){html{background:var(--outer)}}
body{margin:0;height:100%;font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;background:var(--outer);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:8px}
svg{display:block}
.hand{font-family:var(--hand);font-weight:400;letter-spacing:.01em;line-height:.95}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--paper)}
@media (min-width:520px){.shell{height:calc(100% - 32px);margin:16px auto;border-radius:34px;box-shadow:0 30px 80px -30px rgba(0,0,0,.45)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.t-paper{background:var(--paper);color:var(--ink)}
.t-cobalt{background:var(--cobalt);color:#fff;--line:rgba(255,255,255,.4);--ink-2:rgba(255,255,255,.8);--ink-3:rgba(255,255,255,.6)}
.t-night{background:#000;color:#fff;--line:rgba(255,255,255,.32);--ink-2:rgba(255,255,255,.72);--ink-3:rgba(255,255,255,.5);--card:#000}
.pad{padding:0 22px}

/* top bar */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 14px 8px;min-height:60px}
.topbar h1{margin:0;font-size:15px;font-weight:500;text-align:center;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;position:relative}
.icon-btn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--paper)}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cobalt);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.t-cobalt .badge,.t-night .badge{background:#fff;color:var(--cobalt)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 22px;border-radius:999px;background:var(--cobalt);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.005em;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.38;cursor:not-allowed;transform:none}
.btn.chalk{background:#fff;color:var(--cobalt)}
.btn.line{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn.ghost{background:transparent;color:inherit;min-height:44px;font-weight:500}
.btn.small{min-height:40px;font-size:14px;padding:0 16px;width:auto}
.btn.danger{background:var(--danger);color:#fff}
.t-paper .btn.line{border-color:var(--line);color:var(--ink)}
.link{font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* bottom nav (reference: outlined capsule, active pill) */
.nav{flex:none;margin:6px 14px 12px;height:58px;border:1.5px solid var(--line);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;background:var(--paper)}
.t-night .nav{background:#000}
.nav button{height:44px;min-width:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;color:var(--ink)}
.t-night .nav button{color:#fff}
.nav button.on{background:var(--cobalt);color:#fff;padding:0 18px;flex:1;max-width:150px;font-size:14px;font-weight:500}
.nav .badge{top:2px;right:0}

/* cards (reference: thin outline, large radius) */
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 22px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:none;width:218px;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:26px;padding:18px 18px 16px;background:var(--card);position:relative;text-align:left;display:flex;flex-direction:column}
.t-night .pcard{background:#000}
.pcard .p-title{font-size:23px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
.pcard .p-hand{font-size:32px;margin-top:4px}
.pcard .p-sub{font-size:12px;color:var(--ink-2);margin-top:6px}
.pcard .p-art{height:140px;display:grid;place-items:center;margin:6px 0 8px;position:relative}
.pcard .p-foot{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:500;margin-top:auto}
.pcard.oos .p-art{opacity:.45}
.ptag{position:absolute;right:-6px;bottom:4px}
.static .ptag{position:static}
.tagnote{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--danger-bg);color:var(--danger)}
.tagnote.warn{background:var(--warn-bg);color:var(--warn)}

/* highlight bar list (reference: "new collection" bar bleeding to the edge) */
.barlist{list-style:none;margin:0;padding:0}
.barlist button{display:flex;justify-content:space-between;width:100%;padding:2px 22px 2px 10px;font-size:15px;color:var(--ink-2);text-align:left}
.barlist button.on{background:var(--cobalt);color:#fff;font-weight:500}

/* rows */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.lrow:first-child{border-top:0}
.thumb{width:58px;height:58px;border-radius:18px;overflow:hidden;flex:none;background:var(--cobalt);display:grid;place-items:center;color:#fff}
.duo{position:relative;background:var(--cobalt);overflow:hidden}
.duo img{width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;opacity:.92;filter:contrast(1.15) brightness(.95);display:block}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-size:15.5px;font-weight:500;letter-spacing:-.01em}
.lrow .s{font-size:13px;color:var(--ink-2)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 22px;margin:26px 0 10px}
.section-h h2{margin:0;font-size:21px;font-weight:400;letter-spacing:-.02em}

.box{border:1.5px solid var(--line);border-radius:22px;padding:16px;background:var(--card)}
.t-night .box{background:#000}
.note{border-radius:18px;padding:13px 15px;font-size:13.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.note svg{flex:none;margin-top:1px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.danger{background:var(--danger-bg);color:var(--danger)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:transparent;border:1.5px dashed var(--line);color:var(--ink)}
.note b{font-weight:600}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.ink{background:var(--cobalt);color:#fff}
.pill.mute{border:1px solid var(--line);color:var(--ink-2)}

/* sketch chips (hand-drawn ovals) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 15px;border:1.5px solid var(--line);border-radius:48% 52% 46% 54%/58% 44% 56% 42%;font-size:14px;background:transparent;color:inherit}
.chip.on{background:var(--cobalt);color:#fff;border-color:var(--cobalt)}
.t-cobalt .chip.on{background:#fff;color:var(--cobalt);border-color:#fff}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink-2)}
.input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:16px;padding:0 14px;background:var(--card);color:var(--ink);font-size:15px;outline:none}
.input:focus{border-color:var(--cobalt)}
.uline{border:0;border-bottom:1.5px solid var(--line);border-radius:0;background:transparent;height:42px;padding:0 2px}
.err{font-size:12.5px;color:var(--danger)}

.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;height:48px}
.stepper button{width:48px;height:44px;display:grid;place-items:center}
.stepper output{min-width:64px;text-align:center;font-weight:600;font-size:16px}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:20px;margin-bottom:10px;background:var(--card)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;margin-top:1px;display:grid;place-items:center}
.opt.on{border-color:var(--cobalt)}
.opt.on .radio{border-color:var(--cobalt)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--cobalt)}
.opt[aria-disabled="true"]{opacity:.55}
.opt .ot{font-weight:500;font-size:15px}
.opt .os{font-size:13px;color:var(--ink-2)}

.steph{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.steph .n{width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--hand);font-size:18px;flex:none}
.steph h3{margin:0;font-size:18px;font-weight:500;letter-spacing:-.01em}

.sum{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.sum.total{border-top:1.5px solid var(--line);margin-top:8px;padding-top:12px;font-size:17px;font-weight:600}

.sticky-cta{flex:none;padding:12px 18px 14px;background:var(--paper);border-top:1px solid var(--line)}
.t-cobalt .sticky-cta{background:var(--cobalt);border-top-color:transparent}

/* timeline (a real sequence) */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 18px 34px}
.tl li::before{content:"";position:absolute;left:10px;top:20px;bottom:-2px;width:1.5px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .b{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center}
.tl li.done .b{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.tl li.now .b{border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(51,70,168,.18)}
.tl li.now .b::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--cobalt)}
.tl li.bad .b{background:var(--danger);border-color:var(--danger);color:#fff}
.tl .lt{font-size:15px;font-weight:500}
.tl li:not(.done):not(.now):not(.bad) .lt{color:var(--ink-3);font-weight:400}
.tl .ls{font-size:12.5px;color:var(--ink-2)}

.progress{height:10px;border-radius:999px;border:1.5px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--cobalt);border-radius:999px;transition:width 1s linear}

/* sheet & toast */
.overlay{position:absolute;inset:0;background:rgba(10,12,24,.42);display:flex;align-items:flex-end;z-index:40;animation:fade .2s ease}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:30px 30px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.25,1)}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:500;letter-spacing:-.02em}
.sheet p{margin:0 0 14px;color:var(--ink-2);font-size:14.5px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:18px;right:18px;top:14px;z-index:60;background:var(--cobalt);color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:up .25s ease}
.toast.bad{background:var(--danger)}

/* range */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--cobalt);border:3px solid var(--paper);margin-top:-10px;box-shadow:0 0 0 1.5px var(--cobalt)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--cobalt);border:3px solid var(--paper)}

/* screen-specific */
.welcome .w1{font-size:44px;font-weight:400;letter-spacing:-.035em;line-height:1.02;margin:0}
.welcome .w2{display:block;text-align:right}
.welcome .whand{font-size:62px;text-align:right;margin-top:2px;transform:rotate(-3deg)}
.go-round{width:58px;height:58px;border-radius:50%;background:#fff;color:var(--cobalt);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(0,0,0,.4)}
.hero1{font-size:30px;font-weight:400;letter-spacing:-.03em;line-height:1.08;margin:0}
.hero1 .ind{display:block;padding-left:56px}
.herohand{font-size:56px;text-align:right;margin:2px 0 0;transform:rotate(-2deg)}
.qr{background:transparent}
.mapwrap{position:relative;margin:0 14px;border:1.5px solid var(--line);border-radius:28px;overflow:hidden;background:var(--card)}
.kpi{border:1.5px solid var(--line);border-radius:22px;padding:14px 16px;background:var(--card)}
.kpi .kv{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.kpi .kl{font-size:12.5px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 18px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);font-size:14px}
.tabs button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.bubble{max-width:82%;padding:10px 14px;border-radius:20px;font-size:14px;margin-bottom:8px}
.bubble.me{margin-left:auto;background:var(--cobalt);color:#fff;border-bottom-right-radius:6px}
.bubble.them{border:1.5px solid var(--line);border-bottom-left-radius:6px}
.empty{text-align:center;padding:40px 30px}
.empty .hand{font-size:40px;margin:10px 0 8px}

/* photos as duotone (defined once) */
.duo .ph,.thumb .ph{position:absolute;inset:0;background-size:cover;background-position:center;mix-blend-mode:screen;opacity:.92;filter:contrast(1.15) brightness(.95)}
.thumb .duo{position:relative;display:block}
/* tablet layout (mitra) */
.tab-layout{display:flex;height:100%}
.tab-side{width:250px;flex:none;border-right:1px solid var(--line);padding:24px 18px 20px;display:flex;flex-direction:column;background:var(--card);overflow-y:auto}
.tab-nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:14px;font-size:15px;text-align:left;margin-bottom:4px}
.tab-nav.on{background:var(--cobalt);color:#fff}
.tab-main{flex:1;min-width:0;display:flex;flex-direction:column}
.screen.tablet .kpis{grid-template-columns:repeat(4,1fr)}
.screen.tablet .tcols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.screen.tablet .ogrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.screen.tablet .ogrid>.box{margin:0!important}
.screen.tablet .ogrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.screen.tablet .ogrid3>.box{margin:0!important}
.screen.tablet .overlay{justify-content:center}
.screen.tablet~.overlay,.dev.tablet .overlay{justify-content:center}
.dev.tablet .sheet{max-width:540px}

/* ===== presentation shell ===== */
[hidden]{display:none!important}
html.present{background:var(--paper)}
body.present{overflow:auto;height:auto;min-height:100%;background:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:24px 24px}
#pres{min-height:100vh;padding-bottom:30px}
.p-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:26px 44px 22px;border-bottom:1px solid var(--line)}
.p-brand{font-size:26px;font-weight:600;letter-spacing:-.03em;gap:14px}
.p-logo{width:52px;height:52px;border-radius:50%;background:var(--cobalt);color:#fff;display:grid;place-items:center}
.p-title{text-align:center}
.p-title h1{margin:0;font-size:36px;font-weight:600;letter-spacing:-.035em;line-height:1.1}
.p-title p{margin:6px 0 0;color:var(--ink-2);font-size:16px}
.p-plat{display:flex;gap:10px;justify-content:flex-end}
.p-plat button{height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.p-plat button.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
.p-bar{display:flex;align-items:center;gap:6px;margin:22px 44px 0;padding:10px;border:1.5px solid var(--line);border-radius:24px;background:var(--card)}
.p-bar .v{height:46px;padding:0 18px;border-radius:16px;display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px}
.p-bar .v.on{background:var(--cobalt);color:#fff}
.p-edge{height:46px;padding:0 18px;border-radius:16px;display:flex;align-items:center;gap:10px;font-weight:600;background:var(--warn-bg);color:var(--warn);border:1.5px solid currentColor}
.p-row{display:grid;grid-template-columns:270px minmax(0,1fr);gap:30px;padding:40px 0 6px 44px}
.p-intro{padding-top:46px}
.p-tag{display:inline-flex;align-items:center;gap:8px;background:var(--cobalt);color:#fff;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.p-tag.warn{background:var(--warn-bg);color:var(--warn)}
.p-intro p{color:var(--ink-2);font-size:16px;line-height:1.62;margin:18px 0 10px}
.p-count{font-size:40px}
.p-frames{display:flex;gap:34px;overflow-x:auto;padding:0 44px 26px 6px;scrollbar-width:thin}
.p-fig{margin:0;flex:none}
.p-fig figcaption{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.p-fig.left figcaption{justify-content:flex-start;flex-wrap:wrap;gap:8px;font-size:14.5px;margin-bottom:12px;min-height:64px;align-items:flex-start;align-content:flex-start}
.p-num{width:30px;height:30px;border-radius:50%;background:var(--cobalt);color:#fff;display:inline-grid;place-items:center;font-size:14px;font-weight:600;flex:none}
.p-edges{padding-right:44px}
.p-grid{display:grid;grid-template-columns:repeat(4,minmax(0,230px));gap:30px 26px;margin-bottom:34px}
.fwrap{display:block;position:relative;border-radius:30px;text-align:left}
.fwrap .dev{position:absolute;top:0;left:0}
.fwrap:hover::after,.fwrap:focus-visible::after{content:"Coba interaktif";position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:var(--cobalt);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);z-index:20}
.snap{pointer-events:none}
.overlay.still,.sheet.still{animation:none}
.p-foot{text-align:center;padding:10px 44px 20px}
/* live stage */
.p-live{display:grid;grid-template-columns:320px minmax(0,1fr);gap:36px;padding:28px 44px 40px;align-items:start}
.p-live.studio{grid-template-columns:290px minmax(0,1fr)}
.p-side{position:sticky;top:20px}
.p-card{border:1.5px solid var(--line);border-radius:26px;background:var(--card);padding:20px}
.p-node{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:12px}
.p-node b{font-weight:600;color:var(--ink)}
.p-steps{display:flex;flex-direction:column;gap:2px}
.p-steps button{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;text-align:left;font-size:14.5px}
.p-steps button .p-num{width:26px;height:26px;font-size:12.5px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.p-steps button.on{background:var(--cobalt);color:#fff}
.p-steps button.on .p-num{border-color:#fff;color:#fff}
.p-stage{display:flex;justify-content:center;min-width:0}
.devwrap{position:relative}
.devwrap .dev{position:absolute;top:0;left:0}
/* drawer */
.p-drawer{position:fixed;inset:0;z-index:100}
.p-dback{position:absolute;inset:0;background:rgba(10,12,24,.4);animation:fade .2s}
.p-dpanel{position:absolute;top:0;right:0;bottom:0;width:min(460px,92vw);background:var(--paper);color:var(--ink);padding:24px 22px;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.45);animation:slide .25s cubic-bezier(.2,.9,.25,1)}
@keyframes slide{from{transform:translateX(40px);opacity:.5}to{transform:none;opacity:1}}
.p-search{margin:18px 0 8px;border:1.5px solid var(--line);border-radius:16px;padding:0 14px;background:var(--card)}
.p-search input{flex:1;border:0;background:transparent;height:46px;outline:none;font-size:14.5px}
.p-dg{margin:18px 4px 8px}
.p-item{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:20px;padding:14px;margin-bottom:8px;background:var(--card)}
.p-item:hover,.p-item.on{border-color:var(--cobalt)}

/* ===== device frames ===== */
.dev{transform-origin:0 0;padding:12px;border-radius:60px;background:#17181d;box-shadow:inset 0 0 0 2px #34363f,0 40px 70px -40px rgba(0,0,0,.6)}
.dev .dscreen{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:var(--paper);color:var(--ink)}
.dev[data-scr="cobalt"] .dscreen{background:#3346A8;color:#fff}
.dev[data-scr="night"] .dscreen{background:#000;color:#fff}
.dev .sbar{position:absolute;top:0;left:0;right:0;height:50px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 46px;font:600 15px var(--sans);pointer-events:none}
.dev .island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000}
.dev .punch{position:absolute;left:50%;top:12px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#000}
.dev .shell{position:absolute!important;top:50px;left:0;right:0;bottom:24px;height:auto!important;max-width:none!important;margin:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;overflow:hidden}
.dev .hbar{position:absolute;bottom:8px;left:50%;width:134px;margin-left:-67px;height:5px;border-radius:3px;background:currentColor;opacity:.85;pointer-events:none}
.dev.android{border-radius:46px}
.dev.android .dscreen{border-radius:34px}
.dev.android .sbar{height:38px;padding:4px 26px 0;font-size:14px}
.dev.android .shell{top:38px;bottom:18px}
.dev.android .hbar{width:110px;margin-left:-55px;height:4px;bottom:7px}
.dev.web{padding:0;border-radius:18px;background:var(--card);box-shadow:0 0 0 1.5px var(--line),0 40px 70px -40px rgba(0,0,0,.45)}
.dev.web .dscreen{border-radius:18px}
.dev.web .sbar{height:48px;background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:0 14px;gap:12px;justify-content:flex-start;font-weight:500}
.dev.web .dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:5px}
.dev.web .url{flex:1;height:30px;border-radius:999px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.dev.web .shell{top:48px;bottom:0}
.dev.tablet{padding:16px;border-radius:46px}
.dev.tablet .dscreen{width:1024px;height:740px;border-radius:30px}
.dev.tablet .sbar{height:28px;font-size:13px;padding:2px 28px 0}
.dev.tablet .shell{top:28px;bottom:16px}
.dev.tablet .hbar{width:220px;margin-left:-110px;bottom:5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== helpers ===================== */
const IMGK = ['sidamo', 'brazil', 'gayo', 'kopi_nusantara', 'tanamera'];
let CAPTURE = null;
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const rb = n => (Math.round(n / 100) / 10).toLocaleString('id-ID') + 'rb';
const kgf = n => (Math.round(n * 10) / 10).toLocaleString('id-ID') + ' kg';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now();
const MIN = 60000, HOUR = 3600000;
const hhmm = t => new Date(t).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.');
const dshort = t => new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
const mmss = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = p => p + '-' + new Date().toISOString().slice(2, 10).replace(/-/g, '') + '-' + Math.floor(1000 + Math.random() * 9000);

  else it.parts.forEach(p => m[p.bean] = (m[p.bean] || 0) + it.kg * p.pct / 100);
  return m;
}
function cartNeeds(items) { const m = {}; items.forEach(it => { const n = itemNeeds(it); for (const k in n) m[k] = (m[k] || 0) + n[k]; }); return m; }
function itemLabel(it) { return it.type === 'single' ? beanById(it.bean).name : it.name; }
function itemSub(it) { return it.type === 'single' ? `${kgf(it.kg)} · ${rp(beanById(it.bean).price)}/kg` : `${kgf(it.kg)} · ` + it.parts.map(p => `${beanById(p.bean).hand} ${p.pct}%`).join(', '); }
function courierOk(c, roasteryId, addrId, kg) {
  const r = roasteryById(roasteryId), a = addrById(addrId), d = dist(r, a);
  if (c.id === 'instant' && d > 15) return { ok: false, why: `Alamat berjarak ${kmTxt(d)} dari roastery. Kurir instan hanya melayani maks. 15 km.` };
  if (c.id === 'kargo' && kg < 20) return { ok: false, why: 'Kargo untuk pesanan minimal 20 kg.' };
  return { ok: true };
}
function totals(items, roasteryId, co) {
  const r = roasteryById(roasteryId) || ROASTERIES[0];
  const kg = items.reduce((s, it) => s + itemKg(it), 0);
  const beans = items.reduce((s, it) => s + itemBeans(it), 0);
  const roast = co.roast ? kg * r.fee : 0;
  const c = COURIERS.find(x => x.id === co.courier);
  const ship = c ? c.fee(kg) : 0;
  const disc = co.voucher && co.roast ? Math.min(VOUCHER.max, roast * .5) : 0;
  return { kg, beans, roast, ship, disc, total: beans + roast + ship - disc };
}
function addToCart(item, roasteryId, after) {
  if (S.cart.items.length && S.cart.roastery !== roasteryId) {
    const cur = roasteryById(S.cart.roastery);
    ui.pendingAdd = { item, roasteryId, after };
    openSheet(`<h2>Ganti keranjang?</h2>
      <p>Keranjangmu berisi ${S.cart.items.length} item dari <b>${esc(cur.name)}</b>. Satu pesanan hanya bisa diproses satu roastery, jadi item sebelumnya akan dihapus.</p>
      <button class="btn" onclick="confirmSwap()">Ganti keranjang</button>
      <button class="btn ghost" onclick="closeSheet()" style="margin-top:6px">Tetap pakai keranjang lama</button>`);
    return;
  }
  doAdd(item, roasteryId); if (after) after();
}
function confirmSwap() { const p = ui.pendingAdd; S.cart = { roastery: p.roasteryId, items: [] }; closeSheet(); doAdd(p.item, p.roasteryId); toast('Keranjang diganti. Item lama dihapus.'); if (p.after) p.after(); }
function doAdd(item, roasteryId) {
  S.cart.roastery = roasteryId;
  const same = item.type === 'single' && S.cart.items.find(i => i.type === 'single' && i.bean === item.bean);
  if (same) { same.kg = Math.min(avail(item.bean), same.kg + item.kg); }
  else S.cart.items.push(item);
  S.co.error = null;
  save(); render(); toast('Masuk keranjang');
}

/* ===================== order lifecycle ===================== */
function setStatus(o, s, note) {
  o.status = s; o.history.push({ s, t: now(), note: note || '' });
  const t = now();
  if (s === 'roasting') o.roastAt = t;
  if (s === 'pickup') { o.pickupAt = t; o.tries = (o.tries || 0) + 1; }
  if (s === 'arrived') o.arrivedAt = t;
  if (s === 'shipping') {
    const names = ['Agus Prasetyo · AB 4821 KL', 'Dewi Lestari · AB 3390 TA', 'Rudi Hermawan · AB 6624 BG'];
    o.driver = o.courier === 'instant' ? names[(o.tries || 1) % 3] : (o.courier === 'kargo' ? 'Kargo Biteship' : 'JNE Reguler');
    o.resi = 'BTS' + Math.floor(1e8 + Math.random() * 9e8);
  }
  if (s === 'done' && o.roastery === MITRA) settle(o);
  if (o.me) {
    const msg = {
      roasting: ['Pesanan diterima roastery', `${roasteryById(o.roastery).name} mulai menyangrai pesananmu.`],
      packing: ['Roasting selesai', 'Biji sudah disangrai dan sedang dikemas.'],
      pickup: ['Siap dijemput', 'Roastery memanggil kurir untuk pesananmu.'],
      shipping: ['Pesanan dikirim', `Kurir: ${o.driver}. Resi ${o.resi}.`],
      arrived: ['Pesanan tiba', 'Cek paketmu lalu konfirmasi pesanan diterima.'],
      done: ['Pesanan selesai', 'Terima kasih! Dana diteruskan ke roastery.'],
      returned: ['Pengiriman gagal', 'Paket kembali ke roastery. Tim GeoCoffee meninjau kasusmu.'],
    }[s];
    if (msg) notify(msg[0] + ' · ' + o.id, msg[1]);
  }
}
function refund(o, reason) {
  const restock = o.status === 'paid_wait';
  if (restock) { const n = cartNeeds(o.items); for (const k in n) { S.stock[k] = Math.round((S.stock[k] + n[k]) * 10) / 10; if (beanById(k).roastery === MITRA) S.mitra.mutations.unshift({ t: now(), bean: k, d: +n[k].toFixed(1), note: 'Stok dipulihkan · ' + o.id }); } }
  o.refund = { amount: o.totals.total, reason, t: now(), to: PAYS.find(p => p.id === o.pay).name };
  setStatus(o, 'refunded', reason);
  if (o.me) notify('Dana dikembalikan · ' + o.id, `${rp(o.totals.total)} kembali ke ${o.refund.to}. Alasan: ${reason}.`);
}
function settle(o) {
  const gross = o.totals.beans + o.totals.roast, fee = Math.round(gross * .05), net = gross - fee;
  S.mitra.ledger.unshift({ t: now(), kind: 'in', desc: `Pesanan ${o.id} · ${o.totals.kg} kg`, gross, fee, net, st: 'Masuk saldo' });
  S.mitra.balance += net; S.mitra.soldKg += o.totals.kg; S.mitra.revenue += net;
}
function logBatch(o, outKg) {
  const n = cartNeeds(o.items); const top = Object.keys(n)[0];
  S.mitra.batches.unshift({ id: 'B-' + new Date().toISOString().slice(2, 10).replace(/-/g, '') + '-' + String(S.mitra.batches.length + 1).padStart(2, '0'), t: now(), bean: o.items.length === 1 && o.items[0].type === 'single' ? top : 'blend', name: o.items[0].type === 'blend' ? o.items[0].name : null, inKg: o.totals.kg, outKg, profile: o.profile, ref: o.id });
}
function escrowHeld() { return S.orders.filter(o => o.roastery === MITRA && ['paid_wait', 'roasting', 'packing', 'pickup', 'shipping', 'arrived', 'returned'].includes(o.status)).reduce((s, o) => s + o.totals.beans + o.totals.roast, 0); }

/* ===================== payment ===================== */
function createInvoice() {
  const t = totals(S.cart.items, S.cart.roastery, S.co);
  const needs = cartNeeds(S.cart.items);
  for (const k in needs) if (needs[k] > avail(k) + 1e-9) { S.co.error = `Stok ${beanById(k).name} tinggal ${avail(k)} kg. Kurangi jumlah di keranjang.`; return false; }
  for (const k in needs) S.reserved[k] = (S.reserved[k] || 0) + needs[k];
  S.invoice = { id: uid('INV'), createdAt: now(), expiresAt: now() + PAY_TTL, totals: t, pay: S.co.pay, needs, va: '8077 0812 3456 ' + Math.floor(1000 + Math.random() * 9000) };
  S.co.error = null; return true;
}
function startPayment() { if (!createInvoice()) return commit(); save(); go('pay'); }
function releaseInvoice() { const inv = S.invoice; if (!inv) return; for (const k in inv.needs) S.reserved[k] = Math.max(0, (S.reserved[k] || 0) - inv.needs[k]); S.invoice = null; }
function payResult(kind) {
  const inv = S.invoice; if (!inv) return;
  if (kind === 'fail') {
    releaseInvoice(); S.co.error = `Pembayaran ${PAYS.find(p => p.id === inv.pay).name} ditolak penyedia. Stok yang dikunci sudah dilepas; coba metode lain.`;
    save(); ui.stack = ui.stack.filter(r => r.name !== 'pay'); ui.route = { name: 'checkout' }; render(true); toast('Pembayaran ditolak', true); return;
  }
  if (kind === 'expire') { inv.expiresAt = now(); expireInvoice(); return; }
  // success
  for (const k in inv.needs) { S.reserved[k] = Math.max(0, (S.reserved[k] || 0) - inv.needs[k]); S.stock[k] = Math.round((S.stock[k] - inv.needs[k]) * 10) / 10; if (beanById(k).roastery === MITRA) S.mitra.mutations.unshift({ t: now(), bean: k, d: -(+inv.needs[k].toFixed(1)), note: 'Terjual · menunggu roasting' }); }
  const o = { id: uid('GC'), me: true, customer: 'Andi Pratama', roastery: S.cart.roastery, items: JSON.parse(JSON.stringify(S.cart.items)), profile: S.co.profile, roast: S.co.roast, addr: addrById(S.co.addr).line, addrId: S.co.addr, courier: S.co.courier, pay: inv.pay, totals: inv.totals, voucher: S.co.voucher, status: 'paid_wait', createdAt: inv.createdAt, paidAt: now(), history: [{ s: 'paid_wait', t: now() }] };
  S.orders.unshift(o); S.invoice = null; S.cart = { roastery: null, items: [] }; S.co.voucher = null;
  notify('Pembayaran berhasil · ' + o.id, `${rp(o.totals.total)} diamankan di escrow. ${roasteryById(o.roastery).name} punya 45 menit untuk konfirmasi.`);
  save(); ui.stack = []; go('paid', o.id, { reset: true });
}
function expireInvoice() {
  const inv = S.invoice; if (!inv) return;
  releaseInvoice();
  S.orders.unshift({ id: uid('GC'), me: true, customer: 'Andi Pratama', roastery: S.cart.roastery, items: JSON.parse(JSON.stringify(S.cart.items)), profile: S.co.profile, roast: S.co.roast, addr: addrById(S.co.addr).line, courier: S.co.courier, pay: inv.pay, totals: inv.totals, status: 'expired', createdAt: inv.createdAt, history: [{ s: 'unpaid', t: inv.createdAt }, { s: 'expired', t: now(), note: 'Tidak dibayar dalam 15 menit' }] });
  notify('Tagihan kedaluwarsa', 'Pesanan dibatalkan otomatis dan stok dikembalikan ke gudang roastery.');
  save();
  if (ui.route && ui.route.name === 'pay') { ui.stack = []; ui.route = { name: 'expired' }; render(true); }
}

function qrSvg(seedStr, size = 210, color = '#fff') {
  let h = 0; for (const c of seedStr) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h * 1664525 + 1013904223) >>> 0) / 4294967296;
  const N = 25, c = size / N; let r = '';
  const finder = (x, y) => `<rect x="${x * c + c / 2}" y="${y * c + c / 2}" width="${6 * c}" height="${6 * c}" fill="none" stroke="${color}" stroke-width="${c}"/><rect x="${(x + 2) * c}" y="${(y + 2) * c}" width="${3 * c}" height="${3 * c}" fill="${color}"/>`;
  const inF = (x, y) => (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!inF(x, y) && rnd() > .52) r += `<rect x="${x * c}" y="${y * c}" width="${c + .3}" height="${c + .3}"/>`;
  return `<svg class="qr" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Kode QR"><g fill="${color}">${r}</g>${finder(0, 0)}${finder(18, 0)}${finder(0, 18)}</svg>`;
}

function mapParts() {

      <path d="M-10 220C80 210 140 240 230 230S330 200 380 214"/><path d="M60 -10C80 80 70 160 40 320" stroke-dasharray="1 7" stroke-width="2.4"/>
      <path d="M300 -10C280 60 300 140 270 320" stroke-width="1"/><path d="M230 60C250 110 290 140 370 150" stroke-width="1"/>

    <circle cx="180" cy="150" r="9" fill="#fff" stroke="var(--cobalt)" stroke-width="3"/><circle cx="180" cy="150" r="3.5" fill="var(--cobalt)"/>

    <text x="348" y="290" text-anchor="end" font-size="11" fill="var(--ink-2)" font-family="Onest, sans-serif">radius ${R} km</text>
  </svg>`;
  const nearestOut = all.find(x => x.d > R);

        <span class="grow"><span class="t" style="display:block">${esc(r.name)}</span><span class="s">${kmTxt(d)} · ${esc(r.address)}</span></span>
        <span class="row small" style="gap:4px">${I.star(14)} ${r.rating.toString().replace('.', ',')}</span></button>`).join('')}</div>`
    : `<div class="empty" style="padding:24px 10px"><div class="hand">belum ada roastery</div><p class="small muted" style="margin:0 0 16px">Belum ada mitra roastery dalam ${R} km dari ${esc(cityById(S.loc.city).name)}.${nearestOut ? ` Terdekat: ${esc(nearestOut.r.name)}, ${kmTxt(nearestOut.d)}.` : ''}</p>

const BLEND_MIN = 3;
function openBlend(rid) {
  const beans = BEANS.filter(b => b.roastery === rid);
  const p = {}; if (beans[0]) p[beans[0].id] = 60; if (beans[1]) p[beans[1].id] = 40;
  ui.blend = { roastery: rid, name: 'House Blend Andi', kg: 5, parts: p };

}
function blendCheck() {
  const B = ui.blend, ids = Object.keys(B.parts), sum = ids.reduce((s, k) => s + B.parts[k], 0), errs = [];
  if (ids.length < 2) errs.push('Pilih minimal 2 origin untuk membuat blend.');
  if (sum !== 100) errs.push(`Total komposisi ${sum}%. Atur rasio sampai tepat 100%.`);
  if (ids.some(k => B.parts[k] <= 0)) errs.push('Setiap origin yang dipilih harus punya porsi lebih dari 0%.');
  if (B.kg < BLEND_MIN) errs.push(`Minimal batch blend ${BLEND_MIN} kg.`);
  ids.forEach(k => { const need = B.kg * B.parts[k] / 100; if (need > avail(k) + 1e-9) errs.push(`Stok ${beanById(k).name} tinggal ${kgf(avail(k))}, butuh ${kgf(need)}.`); });
  if (!B.name.trim()) errs.push('Beri nama blend-mu.');
  const price = ids.reduce((s, k) => s + B.kg * B.parts[k] / 100 * beanById(k).price, 0);
  return { sum, errs, price };
}

      <div class="between" style="margin-top:10px">${stepper(kgf(it.kg), `cartKg(${i},-1)`, `cartKg(${i},1)`, 'Jumlah kg')}<b>${rp(itemBeans(it))}</b></div></div>`).join('')}</div>
    <div class="pad" style="margin-top:8px"><div class="sum"><span>Subtotal biji (${kgf(t.kg)})</span><span>${rp(t.beans)}</span></div><div class="small muted">Biaya roasting, ongkir, dan diskon dihitung di checkout.</div></div>

function cartRemove(i) { S.cart.items.splice(i, 1); if (!S.cart.items.length) S.cart.roastery = null; commit(); }
function cartKg(i, d) {
  const it = S.cart.items[i]; const min = it.type === 'blend' ? BLEND_MIN : 1; const n = it.kg + d;
  if (n < min) { if (it.type === 'single') return cartRemove(i); toast(`Minimal batch blend ${BLEND_MIN} kg`, true); return; }
  const others = cartNeeds(S.cart.items.filter((_, j) => j !== i)); const mine = itemNeeds({ ...it, kg: n });
  for (const k in mine) if (mine[k] + (others[k] || 0) > avail(k) + 1e-9) { toast(`Stok ${beanById(k).hand} tidak cukup`, true); return; }
  it.kg = n; commit();
}

  }
  const idx = FLOW.findIndex(f => f[0] === o.status);
  return `<ul class="tl">${FLOW.map(([s, l], i) => { const st = i < idx || o.status === 'done' ? 'done' : i === idx ? 'now' : ''; const hh = h(s);
    return `<li class="${st}"><span class="b">${st === 'done' ? I.check(12) : ''}</span><div class="lt">${l}</div>${hh.t ? `<div class="ls">${hhmm(hh.t)}${hh.note ? ' · ' + esc(hh.note) : ''}</div>` : ''}</li>`; }).join('')}</ul>`;
}

/* ===================== ticker: countdowns, SLA, driver, auto-complete ===================== */
function updateCountdowns() { document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = mmss(+el.dataset.cd - now()); }); }
function tick() {
  let changed = false; const t = now();
  if (S.invoice && t >= S.invoice.expiresAt) { expireInvoice(); changed = true; }
  S.orders.forEach(o => {
    if (o.status === 'paid_wait' && t >= o.paidAt + SLA) { refund(o, 'Roastery melewati batas 45 menit'); changed = true; }
    if (o.status === 'pickup' && t >= o.pickupAt + 6000) { setStatus(o, 'shipping'); changed = true; }
    if (o.status === 'arrived' && t >= o.arrivedAt + 48 * HOUR) { setStatus(o, 'done', 'Selesai otomatis 48 jam'); changed = true; }
  });
  S.mitra.ledger.forEach(l => { if (l.st === 'Diproses BI-FAST' && t >= l.doneAt) { l.st = 'Berhasil'; changed = true; } });
  if (changed) { save(); if (!ui.sheet) render(); }
  else { updateCountdowns(); if (t % 10000 < 1000 && ui.route && (ui.route.name === 'order' || ui.route.name === 'mitra') && !ui.sheet) render(); }
}

  { code: 'SCEN-11', grp: 'Payment gateway', edge: 1, title: 'Tagihan QRIS kedaluwarsa', node: 'B_PAY_EXPIRED', desc: 'Tidak dibayar 15 menit; pesanan batal otomatis dan stok dipulihkan.', setup: () => { H.sido(); return { route: 'expired' }; } },
  { code: 'SCEN-12', grp: 'Payment gateway', edge: 1, title: 'Driver tidak merespons', node: 'B_COURIER_RESP (timeout)', desc: 'Pencarian ulang otomatis di layanan kurir yang sama.', setup: () => ({ route: 'order', param: H.order(['accept', 'roasted', 'ready', 'timeout']).id }) },
  { code: 'SCEN-13', grp: 'Outlet & logistik', edge: 1, title: 'Roastery lewat batas 45 menit', node: 'O_SLA_CHECK (timeout)', desc: 'Pesanan batal otomatis dan dana kembali penuh.', setup: () => { const o = H.order([], { paidAgo: 46 }); refund(o, 'Roastery melewati batas 45 menit'); return { route: 'order', param: o.id }; } },
  { code: 'SCEN-14', grp: 'Outlet & logistik', edge: 1, title: 'Roastery menolak pesanan', node: 'O_DECISION (tolak)', desc: 'Alasan penolakan dikirim ke pembeli dan refund berjalan otomatis.', setup: () => { const o = H.order([]); refund(o, 'Ditolak roastery: stok fisik tidak sesuai'); return { route: 'order', param: o.id }; } },
  { code: 'SCEN-15', grp: 'Outlet & logistik', edge: 1, title: 'Gagal antar, retur ke roastery', node: 'L_FAILED → L_RETURN', desc: 'Paket kembali ke toko dan tiket peninjauan dibuka.', setup: () => ({ route: 'order', param: H.order(['accept', 'roasted', 'ready', 'driver', 'fail']).id }) },
  { code: 'SCEN-16', grp: 'Outlet & logistik', edge: 1, title: 'Refund berhasil diproses', node: 'B_AUTO_REFUND → C_REFUND_DONE', desc: 'Notifikasi dana kembali ke metode pembayaran pembeli.', setup: () => { H.order(['accept', 'roasted', 'ready', 'driver', 'fail', 'manualRefund']); return { route: 'notifs' }; } },
];
const scnBy = c => SCN.find(x => x.code === c);

function capture(sc) {
  const S0 = S, ui0 = ui; let r = {}, out, html = '', sheet = null;
  S = seed(); S.onboarded = true; S.theme = S0.theme; ui = freshUi(); ui.device = sc.dev === 'tablet' ? 'tablet' : 'phone';
  CAPTURE = { sheet: null };
  try {
    r = sc.setup() || {}; ui.route = { name: r.route, param: r.param };
    out = SCREENS[r.route](r.param); html = screenHtml(out);
    if (r.then) r.then(); sheet = CAPTURE.sheet;
  } catch (e) { console.error(sc.code, e); html = `<div class="screen t-paper"><p style="padding:30px">${esc(e.message)}</p></div>`; out = { theme: 'paper' }; }
  finally { CAPTURE = null; S = S0; ui = ui0; }
  return { html, theme: out.theme, sheet, scrollTo: r.scrollTo };
}
function loadScenario(code) {
  const sc = scnBy(code); if (!sc) return;
  const theme = S.theme; closeSheet();
  S = seed(); S.onboarded = true; S.theme = theme; ui = freshUi(); ui.device = sc.dev === 'tablet' ? 'tablet' : 'phone';
  const r = sc.setup() || {};
  ui.route = { name: r.route, param: r.param };
  if (!['home', 'welcome', 'map', 'orders', 'cart', 'profile', 'mitra'].includes(r.route)) ui.stack = [{ name: 'home' }];
  save(); P.cur = code;
  if (P.on) P.setView(sc.dev === 'tablet' ? 'studio' : 'walk', true);
  render(true);
  if (r.then) r.then();
  if (r.scrollTo) setTimeout(() => scrollInside(document.getElementById('app'), r.scrollTo, 1), 60);
}
function scrollInside(root, sel, scale) {
  const sc = root && root.querySelector('.scroll'), el = root && root.querySelector(sel); if (!sc || !el) return;
  sc.scrollTop += (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / scale - 70;
}

/* ===================== presentation shell (desktop) ===================== */
const DIMS = { ios: [414, 868], android: [414, 868], web: [390, 844], tablet: [1056, 772] };
const SIG = `<svg width="68" height="12" viewBox="0 0 68 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/><path d="M30 3.5a9 9 0 0 1 11 0l-1.4 1.6a7 7 0 0 0-8.2 0zM32.4 6.4a5.4 5.4 0 0 1 6.2 0L35.5 10z"/><rect x="45" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="47" y="3" width="15" height="6" rx="1.5"/><rect x="66" y="4" width="1.6" height="4" rx=".8"/></svg>`;
function devInner(plat, inner) {
  const sbar = plat === 'web' ? `<div class="sbar"><span class="dots"><i></i><i></i><i></i></span><span class="url">${I.shield(13)} geocoffee.id</span></div>`
    : plat === 'tablet' ? `<div class="sbar"><span>9.41</span><span>${new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short' })}</span><span>${SIG}</span></div>`
      : `<div class="sbar"><span>9.41</span><i class="${plat === 'ios' ? 'island' : 'punch'}"></i><span>${SIG}</span></div>`;
  return `<div class="dscreen">${sbar}${inner}${plat === 'web' ? '' : '<i class="hbar"></i>'}</div>`;
}
var P = {
  on: false, view: 'canvas', plat: 'ios', cur: 'SCREEN-02', q: '',
  init() {
    this.on = true;
    document.documentElement.classList.add('present'); document.body.classList.add('present');
    const shell = document.getElementById('shell');
    const root = document.createElement('div'); root.id = 'pres';
    root.innerHTML = `
      <header class="p-head">
        <div class="row p-brand"><span class="p-logo">${SK.beans(34, 24)}</span><span>GeoCoffee</span></div>

        <div class="p-plat" role="group" aria-label="Bingkai perangkat">${[['android', 'Android'], ['ios', 'iOS'], ['web', 'Web']].map(([k, l]) => `<button data-plat="${k}" onclick="P.setPlat('${k}')">${l}</button>`).join('')}</div>
      </header>
      <nav class="p-bar" aria-label="Mode tampilan">
        <span class="small muted" style="padding:0 8px 0 10px">Tampilan</span>
        <button class="v" data-v="canvas" onclick="P.setView('canvas')">${I.grid(19)} Figma canvas (semua layar)</button>
        <button class="v" data-v="walk" onclick="P.setView('walk')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg> Walkthrough customer app</button>
        <button class="v" data-v="studio" onclick="P.setView('studio')"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M8 22h8"/></svg> Dashboard mitra studio</button>
        <span style="flex:1"></span>
        <button class="p-edge" onclick="P.drawer(true)">${I.alert(18)} 16 skenario edge cases</button>
      </nav>
      <section class="p-live" id="pLive" hidden><aside class="p-side" id="pSide"></aside><div class="p-stage" id="pStage"><div class="devwrap" id="devWrap"><div class="dev ios" id="dev"></div></div></div></section>
      <section id="pCanvas"></section>
      <div class="p-drawer" id="pDrawer" hidden><div class="p-dback" onclick="P.drawer(false)"></div>
        <aside class="p-dpanel" role="dialog" aria-label="Skenario edge case">
          <div class="between" style="align-items:flex-start"><div><h2 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em">16 skenario edge cases</h2><p class="small muted" style="margin:4px 0 0">Jalur gagal dari diagram alur. Klik untuk mencobanya di simulator.</p></div><button class="icon-btn" onclick="P.drawer(false)" aria-label="Tutup">${I.x(22)}</button></div>
          <label class="row p-search">${I.search(18)}<input id="pQ" placeholder="Cari skenario: GPS, stok, blend, kurir…" oninput="P.q=this.value;P.drawList()" aria-label="Cari skenario"></label>
          <div id="pDlist"></div>
        </aside></div>`;
    document.body.appendChild(root);
    this.shell = shell; this.buildDev();
    window.addEventListener('resize', () => this.fit());
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !document.getElementById('pDrawer').hidden) return this.drawer(false);
      const tag = (document.activeElement || {}).tagName; if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      if (this.view === 'canvas' || ui.sheet) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k') {
        e.preventDefault(); const i = SCN.findIndex(s => s.code === this.cur), d = (e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1;

  },
  buildDev() {
    const dev = document.getElementById('dev'), kind = this.view === 'studio' ? 'tablet' : this.plat;

    if (!this.on || this.view === 'canvas') return;
    const kind = this.view === 'studio' ? 'tablet' : this.plat, [W, Hh] = DIMS[kind];
    const stage = document.getElementById('pStage'), top = stage.getBoundingClientRect().top + window.scrollY;

  setPlat(k) { this.plat = k; this.markPlat(); if (this.view === 'canvas') this.renderCanvas(); else if (this.view === 'walk') this.buildDev(); },
  markPlat() { document.querySelectorAll('.p-plat button').forEach(b => b.classList.toggle('on', b.dataset.plat === this.plat)); },
  setView(v, fromLoad) {
    this.view = v;

  },
  sync() {
    if (this.view === 'canvas') return;
    if (this.view === 'studio' && !this.cur.startsWith('SCEN')) this.cur = 'MITRA-0' + (['ringkasan', 'pesanan', 'produksi', 'stok', 'keuangan'].indexOf(ui.mitraTab) + 1);

      <div class="p-card">

        <div class="hand" style="font-size:38px;margin:12px 0 6px">${esc(sc.title)}</div>
        <p class="small muted" style="margin:0 0 12px;line-height:1.55">${esc(sc.desc)}</p>
        <div class="p-node">${I.info(15)}<span>Node alur: <b>${esc(sc.node)}</b></span></div>
      </div>
      <div class="small muted" style="margin:22px 4px 8px">${this.view === 'studio' ? 'Modul dashboard mitra' : 'Alur pelanggan'}</div>
      <div class="p-steps">${list.map((s, i) => `<button class="${s.code === this.cur ? 'on' : ''}" onclick="loadScenario('${s.code}')"><span class="p-num">${i + 1}</span><span>${esc(s.title)}</span></button>`).join('')}</div>
      ${this.view === 'studio' ? `<div class="note info" style="margin-top:16px">${I.swap(18)}<div>Pesanan yang dibayar di walkthrough customer app langsung masuk ke dashboard ini. Status yang kamu ubah di sini terlihat di layar lacak pesanan pembeli.</div></div>` : ''}
      <div class="small muted" style="margin:18px 4px 0;line-height:1.6">Semua tombol di dalam layar bisa dipakai. Tekan ↑ ↓ untuk pindah skenario.</div>
      <button class="btn line small" style="margin-top:14px" onclick="loadScenario('${sc.code}')">${I.swap(16)} Ulang skenario ini</button>`;
  },
  frame(sc, scale) {
    const snap = capture(sc), kind = sc.dev === 'tablet' ? 'tablet' : this.plat, [W, Hh] = DIMS[kind];
    const sheet = snap.sheet ? `<div class="overlay still"><div class="sheet still"><div class="grab"></div>${snap.sheet}</div></div>` : '';
    return `<div class="fwrap" role="button" tabindex="0" style="width:${W * scale}px;height:${Hh * scale}px" ${snap.scrollTo ? `data-scroll="${snap.scrollTo}" data-scale="${scale}"` : ''} onclick="loadScenario('${sc.code}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();loadScenario('${sc.code}')}" aria-label="Coba ${esc(sc.title)} secara interaktif">

        <div class="p-frames">${cust.map((s, i) => `<figure class="p-fig"><figcaption><span class="p-num">${i + 1}</span>${esc(s.title)}</figcaption>${this.frame(s, .66)}</figure>`).join('')}</div>

    document.getElementById('pDlist').innerHTML = (groups.map(g => `<div class="small muted p-dg">${g}</div>${edge.filter(s => s.grp === g).map(item).join('')}`).join('')
      + (main.length ? `<div class="small muted p-dg">Alur utama &amp; dashboard mitra</div>${main.map(item).join('')}` : '')) || `<p class="small muted" style="padding:20px 4px">Tidak ada skenario untuk “${esc(q)}”.</p>`;

/* ===================== boot ===================== */
applyTheme();
const PRESENT = window.innerWidth >= 900 && location.hash !== '#app';
if (!S.onboarded) ui.route = { name: 'welcome' };
else if (S.account.mode === 'mitra' && S.account.mitra === 'verified') ui.route = { name: 'mitra' };
else ui.route = { name: 'home' };
if (PRESENT) { P.init(); if (ui.route.name === 'mitra') { S.account.mode = null; ui.route = { name: 'home' }; } P.setView('canvas'); render(true); }
else render(true);
setInterval(tick, 1000);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.sheet && !(ui.sheet.opts || {}).locked) closeSheet(); });

</script>
